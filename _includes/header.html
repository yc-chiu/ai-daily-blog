<header class="site-header">
  <div class="wrap header-bar">
    <a class="brand" href="{{ '/' | relative_url }}"><span class="brand-dot" aria-hidden="true"></span>{{ site.title }}</a>
    <div class="header-actions">
    <nav class="nav" aria-label="主要">
      <a href="{{ '/' | relative_url }}"{% if page.home %} aria-current="page"{% endif %}>首頁</a>
      <a href="{{ '/tags/' | relative_url }}"{% if page.url contains '/tags/' %} aria-current="page"{% endif %}>標籤</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url contains '/about/' %} aria-current="page"{% endif %}>關於</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </nav>
      <button type="button" class="theme-toggle" aria-label="切換深色模式" aria-pressed="false">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
<script>
  (function () {
    var root = document.documentElement;
    var btn = document.querySelector(".theme-toggle");
    var meta = document.querySelector('meta[name="theme-color"]');
    function sync() {
      var dark = root.getAttribute("data-theme") === "dark";
      btn.setAttribute("aria-pressed", dark ? "true" : "false");
      btn.setAttribute("aria-label", dark ? "切換為淺色模式" : "切換為深色模式");
      if (meta) meta.setAttribute("content", dark ? "#161412" : "#f6f3ee");
    }
    btn.addEventListener("click", function () {
      var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("theme", next); } catch (e) {}
      sync();
    });
    sync();
  })();
</script>
</header>
