<header class="site-header">
  <div class="wrap header-bar">
    <a class="brand" href="{{ '/' | relative_url }}"><span class="brand-dot" aria-hidden="true"></span>{{ site.title }}</a>
    <nav class="nav" aria-label="主要">
      <a href="{{ '/' | relative_url }}"{% if page.home %} aria-current="page"{% endif %}>首頁</a>
      <a href="{{ '/tags/' | relative_url }}"{% if page.url contains '/tags/' %} aria-current="page"{% endif %}>標籤</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url contains '/about/' %} aria-current="page"{% endif %}>關於</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </nav>
  </div>
</header>
